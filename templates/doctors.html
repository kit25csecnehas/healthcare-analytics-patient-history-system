
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .doctor-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .doctor-form label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            color: #52637a;
        }
        .doctor-form input {
            padding: 12px;
            border: 1px solid #dce4ef;
            border-radius: 8px;
            font: inherit;
        }
        .doctor-form button {
            padding: 12px;
            background: #3678f5;
            color: white;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }
        .doctor-form .full { grid-column: 1 / -1; }
        .table-wrap { overflow-x: auto; margin-top: 22px; }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #e7edf5;
            font-size: 13px;
        }
        th { background: #f4f7fc; }
        .back-link { color: #3678f5; text-decoration: none; }
        @media (max-width: 650px) {
            .doctor-form { grid-template-columns: 1fr; }
            .doctor-form .full { grid-column: auto; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h2>✚ HealthCare</h2>
        <p class="menu-label">MAIN MENU</p>
        <a href="/">Dashboard</a>
        <a href="/patients">Patients</a>
        <a class="active" href="/doctors">Doctors</a>
        <a href="/#appointments">Appointments</a>
        <a href="/#analytics">Analytics</a>
        <div class="sidebar-footer">Patient History System</div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <p class="eyebrow">HEALTHCARE TEAM</p>
                <h1>Doctor Management</h1>
                <p class="subtitle">Register and manage healthcare professionals.</p>
            </div>
            <a href="/" class="back-link">← Dashboard</a>
        </header>

        <section class="panel">
            <h3>Register a Doctor</h3>
            <form id="doctor-form" class="doctor-form">
                <label>
                    Doctor Name *
                    <input name="doctor_name" required maxlength="100"
                           placeholder="Enter doctor name">
                </label>
                <label>
                    Specialization
                    <input name="specialization" maxlength="100"
                           placeholder="e.g. Cardiology">
                </label>
                <label>
                    Phone
                    <input name="phone" maxlength="15"
                           placeholder="Phone number">
                </label>
                <label>
                    Email
                    <input name="email" type="email" maxlength="100"
                           placeholder="Email address">
                </label>
                <button class="full" type="submit">+ Register Doctor</button>
            </form>
            <p id="doctor-message" role="status"></p>
        </section>

        <section class="panel" style="margin-top:24px">
            <h3>Registered Doctors</h3>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Phone</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody id="doctor-list">
                        <tr><td colspan="5">Loading doctors...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        async function loadDoctors() {
            const tbody = document.getElementById("doctor-list");
            tbody.replaceChildren();

            try {
                const response = await fetch("/api/doctors");
                if (!response.ok) throw new Error("Could not load doctors.");

                const doctors = await response.json();

                if (doctors.length === 0) {
                    tbody.innerHTML =
                        '<tr><td colspan="5">No doctors registered yet.</td></tr>';
                    return;
                }

                for (const doctor of doctors) {
                    const row = document.createElement("tr");

                    for (const value of [
                        doctor.doctor_id,
                        doctor.doctor_name,
                        doctor.specialization || "—",
                        doctor.phone || "—",
                        doctor.email || "—"
                    ]) {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    }

                    tbody.appendChild(row);
                }
            } catch (error) {
                tbody.replaceChildren();
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.colSpan = 5;
                cell.textContent = error.message;
                row.appendChild(cell);
                tbody.appendChild(row);
            }
        }

        document.getElementById("doctor-form").addEventListener(
            "submit", async event => {
                event.preventDefault();

                const form = event.currentTarget;
                const data = Object.fromEntries(new FormData(form).entries());
                const message = document.getElementById("doctor-message");

                try {
                    const response = await fetch("/api/doctors", {
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    if (!response.ok) {
                        throw new Error(result.error || "Registration failed");
                    }

                    message.textContent =
                        result.message + " Doctor ID: " + result.doctor_id;
                    form.reset();
                    await loadDoctors();
                } catch (error) {
                    message.textContent = error.message;
                }
            }
        );

        loadDoctors();
    </script>
</body>
</html>
